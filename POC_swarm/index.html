<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Number Swarm</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>P2P Number Swarm</h1>

    <section id="local-peer">
        <h2>Your Peer ID: <span id="local-peer-id"></span></h2>
    </section>

    <section id="connected-peers">
        <h2>Connected Peers:</h2>
        <ul id="peer-list">
            <!-- Peer items will be added here -->
        </ul>
    </section>

    <section id="number-management">
        <h2>Your Number:</h2>
        <p id="local-number-display">N/A</p>
        <button id="generate-number-btn">Generate New Number</button>
    </section>

    <section id="swarm-data">
        <h2>Swarm Maximum:</h2>
        <p id="swarm-max-display">N/A</p>
    </section>

    <!--
      irc-framework MUST load before app.js, which references IrcFramework at
      startup. It is not vendored here. Build a browser bundle first:

          npm install irc-framework browserify
          npx browserify -r irc-framework -s IrcFramework -o irc-framework.browser.js

      then uncomment the tag below.

      Note this is necessary but NOT sufficient: a browser cannot open a raw TCP
      socket to irc.libera.chat:6697, so a WebSocket-to-IRC gateway is also
      required. See README.md. For a version that runs today, use
      ../swarm/irc_rendezvous.py instead.
    -->
    <!-- <script src="irc-framework.browser.js"></script> -->
    <script src="app.js"></script>
</body>
</html>
